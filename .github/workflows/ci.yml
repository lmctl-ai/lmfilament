name: ci

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single matrix job (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["durable-memory/**", "**.md"]
  pull_request:
    paths-ignore: ["durable-memory/**", "**.md"]

# Build jobs only read; the release job alone gets contents: write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Every push to main is a release: MAJOR.MINOR comes from the repo, the patch is the workflow run number.
      # A pushed v* tag releases that exact version. Pull requests and manual runs never release.
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            echo "v=$(scripts/stamp-version.sh --base).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "v=" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15,         name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    timeout-minutes: 120
    env:
      ONLY_OK: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || matrix.name == inputs.only }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          persist-credentials: false
      - name: stamp release version
        if: needs.version.outputs.v != ''
        run: scripts/stamp-version.sh "${{ needs.version.outputs.v }}"

      - name: "toolchain (linux, clang 18 + static libc++)"
        if: runner.os == 'Linux' && env.ONLY_OK == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang-18 libc++-18-dev libc++abi-18-dev libunwind-18-dev libclang-rt-18-dev
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"

      - name: "toolchain (macos, Apple clang + ninja)"
        if: runner.os == 'macOS' && env.ONLY_OK == 'true'
        run: |
          brew install ninja
          clang --version | head -1

      - name: fetch Filament (filament.lock) and verify vendored sdk header
        if: env.ONLY_OK == 'true'
        run: |
          scripts/sync-filament.sh
          scripts/sync-sdk.sh --verify

      - name: cache Filament static libraries
        if: env.ONLY_OK == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/filament-build
          key: filament-${{ matrix.name }}-${{ hashFiles('filament.lock', 'scripts/build-filament.sh') }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          node-version: 24

      - name: lmscript compiler (npm @lmctl-ai/lmctl, DSL v5)
        if: env.ONLY_OK == 'true'
        run: |
          npm i -g @lmctl-ai/lmctl@0.2.401
          lmscript --version

      - name: build Filament
        if: env.ONLY_OK == 'true'
        run: scripts/build-filament.sh

      - name: build lmfilament
        if: env.ONLY_OK == 'true'
        run: scripts/build.sh

      - name: test (signatures, static link, every example)
        if: env.ONLY_OK == 'true'
        run: ./test.sh

      - name: package artifact
        if: env.ONLY_OK == 'true'
        run: |
          mkdir -p dist
          cp build/host/lmfilament "dist/lmfilament-${{ matrix.name }}"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cp third_party/filament/LICENSE dist/FILAMENT-LICENSE
          if [ "$RUNNER_OS" = Linux ]; then
            # glibc is statically linked (LGPL-2.1+): ship the application objects and link line for relinking.
            tar -C build/host -czf "dist/lmfilament-${{ matrix.name }}-relink-objects.tar.gz" CMakeFiles/lmfilament.dir build.ninja
          fi
          (cd dist && shasum -a 256 "lmfilament-${{ matrix.name }}" > "lmfilament-${{ matrix.name }}.sha256")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ONLY_OK == 'true'
        with:
          name: lmfilament-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      REL_VERSION: ${{ needs.version.outputs.v }}
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmfilament-*
          path: dist
          merge-multiple: true

      - name: tag matches lmfilament --version (lmscript @latest compares them)
        run: |
          chmod +x dist/lmfilament-linux-x64
          got="$(dist/lmfilament-linux-x64 --version)"
          want="lmfilament $REL_VERSION (filament $(sed -n 's/^version=//p' filament.lock))"
          test "$got" = "$want" || { echo "::error::tag v$REL_VERSION but binary says '$got' (bump project VERSION in CMakeLists.txt)"; exit 1; }

      - name: attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # LICENSE / THIRD_PARTY_NOTICES.md / FILAMENT-LICENSE are identical across artifacts and merge into one copy.
          if gh release view "v$REL_VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$REL_VERSION" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "v$REL_VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "v$REL_VERSION" --generate-notes dist/*
          fi
